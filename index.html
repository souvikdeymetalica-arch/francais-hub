<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b56">
<title>FrançaisHub — French Reference</title>
<style>
:root{--nav:#183b56;--ink:#17202a;--muted:#66727e;--line:#dce2e6;--bg:#f6f8f9;--card:#fff;--accent:#d9a441}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{max-width:1180px;margin:auto;padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.brand b{font-family:Georgia,serif;font-size:22px;color:var(--nav)}.brand small{color:var(--muted)}
.tabs{max-width:1180px;margin:auto;display:flex;gap:6px;overflow:auto;padding:0 14px 9px;-webkit-overflow-scrolling:touch}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:13px}
.tabs button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
main{max-width:1180px;margin:auto;padding:0 14px 50px}.view{display:none}.view.active{display:block}
.hero{padding:28px 0 18px}.hero h1{font:700 clamp(31px,7vw,56px)/1.05 Georgia,serif;margin:0 0 9px;color:var(--nav)}.hero p{color:var(--muted);margin:0;max-width:720px}
.searchWrap{position:relative;margin:18px 0}.searchBox{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid var(--nav);border-radius:14px;padding:11px 13px;box-shadow:0 5px 18px #0000000d}
.searchBox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}.kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 6px;border-radius:5px}
.results{position:absolute;left:0;right:0;top:61px;z-index:300;background:#fff;border:1px solid var(--line);border-radius:0 0 13px 13px;box-shadow:0 16px 35px #0002;max-height:65vh;overflow:auto;display:none}
.result{display:block;width:100%;border:0;border-bottom:1px solid #edf0f2;background:#fff;text-align:left;padding:12px 14px}.result:hover{background:#f2f5f6}.result b{display:block}.result small{display:block;color:var(--muted);margin-top:3px}
.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 15px}.chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px}.card h3{margin:0 0 7px;color:var(--nav)}.card p{margin:6px 0;line-height:1.5}.muted{color:var(--muted)}.tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.word{font:700 28px Georgia,serif;color:var(--nav)}.answer{display:none;margin-top:10px;padding:10px;background:#f1f5f6;border-radius:8px}
.detail{max-width:850px}.detail .word{font-size:42px}.back{margin-bottom:14px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px}
footer{max-width:1180px;margin:auto;padding:25px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.brand small{display:none}.grid{grid-template-columns:1fr}.hero{padding-top:22px}.hero h1{font-size:37px}main{padding:0 10px 40px}}
</style>

<style>
.livebar{display:flex;align-items:center;gap:8px;background:#102d43;color:#fff;border-radius:11px;padding:9px 11px;margin:10px 0 14px;font-size:13px}
.dot{width:8px;height:8px;background:#61d095;border-radius:50%;box-shadow:0 0 0 4px #61d09522}
.newsTools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.newsTools button,.gameControls button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px}
.newsCard{display:block;text-decoration:none;color:inherit}
.newsMeta{font-size:11px;color:var(--muted);margin-top:8px}
.game{max-width:720px;margin:auto}
.gameGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:520px;margin:16px auto}
.cell{aspect-ratio:1;border:1px solid #c9d1d6;background:#fff;border-radius:4px;position:relative}
.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:700;font-size:20px;text-transform:uppercase;outline:0}
.cell small{position:absolute;top:1px;left:3px;font-size:8px;color:#777;pointer-events:none}
.gameMsg{min-height:28px;margin:10px 0;font-weight:600}
.gameControls{display:flex;gap:8px;flex-wrap:wrap}
.gameControls .primary{background:#183b56;color:#fff;border-color:#183b56}
</style>
<link rel="manifest" href="manifest.json"></head>

 <div class="brand"><div><b>FrançaisHub</b><br><small>French dictionary • grammar • translation • news</small></div><button id="homeBtn" aria-label="Home">⌂</button></div>

],

["Imparfait","Stem from nous form minus -ons + endings -ais, -ais, -ait, -ions, -iez, -aient. Used for background, habits and ongoing past states.","B1"],
["Plus-que-parfait","Imparfait of avoir/être + past participle; an action completed before another past action.","B2"],
["Futur simple","Infinitive + -ai, -as, -a, -ons, -ez, -ont; irregular stems include ser-, aur-, ir-, fer-, viendr-.","B1–B2"],

["Conditionnel passé","Conditional of avoir/être + past participle; regret, unreal past condition and hypothetical result.","B2–C1"],

["COD / COI","COD replaces a direct object; COI generally replaces an object introduced by à. Pronouns normally precede the conjugated verb.","B1–B2"],
["Y / EN","y commonly replaces à + place/thing; en replaces de + thing and quantities. Their order follows fixed pronoun sequences.","B2"],
["Après que / bien que","Après que normally takes the indicative; bien que takes the subjunctive.","C1"],
["Ne explétif","May appear after à moins que, de peur que and avant que; it does not itself make the clause negative.","C1"],
["Dont / lequel","Dont replaces de + noun/pronoun; lequel and its forms are used after many prepositions and for precise reference.","B2–C1"]

const TABS=[
["home","⌂ Home"],["dictionary","📖 Dictionary"],["grammar","📚 Grammar"],["translation","🇬🇧→🇫🇷 Translation"],
["synonyms","🔤 Synonyms & Antonyms"],["phrases","💬 Phrases & Idioms"],["vocabulary","🧠 Vocabulary"],
["news","📰 Daily News"],["crossword","🧩 Crossword"],["conjugation","🔄 Conjugation"],["collocations","🔗 Collocations"],["exercises","✍️ Exercises"]
];
const app=document.getElementById("app"),tabs=document.getElementById("tabs");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function tabButtons(){tabs.innerHTML=TABS.map(t=>`<button data-tab="${t[0]}">${t[1]}</button>`).join("");tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.tab))}
function shell(id,title,sub,body){return `<section class="view" id="${id}"><div class="hero"><h1>${title}</h1><p>${sub}</p></div>${body}</section>`}
function render(){
 app.innerHTML=[
 shell("home","French, one search away.","A fast mobile reference for vocabulary, grammar, translation, conjugation and natural French.",`<div class="searchWrap"><div class="searchBox">⌕ <input id="search" autocomplete="off" placeholder="Search: avoir, passé composé, although, fiable…"><span class="kbd">⌘K</span></div><div class="results" id="results"></div></div><div class="chips" id="chips">${["avoir","passé composé","subjonctif","bien que","formal complaint","synonyms"].map(x=>`<button data-q="${x}">${x}</button>`).join("")}</div><div class="grid"><button class="card" data-go="dictionary"><h3>📖 Dictionary</h3><p class="muted">Meaning, level, examples and related words.</p></button><button class="card" data-go="grammar"><h3>📚 Grammar</h3><p class="muted">Rules, exceptions and special usages.</p></button><button class="card" data-go="translation"><h3>🇬🇧→🇫🇷 Translation</h3><p class="muted">English ↔ French workspace.</p></button><button class="card" data-go="news"><h3>📰 Daily News</h3><p class="muted">French reading and vocabulary.</p></button></div>`),
 shell("dictionary","French Dictionary","A larger CEFR-organized reference: B1, B2 and C1 vocabulary, meanings, collocations, synonyms and antonyms.",`<div class="searchBox"><input id="dictSearch" placeholder="Search word or English meaning…"></div><div class="chips" id="levelChips"><button data-level="all">All levels</button><button data-level="B1">B1</button><button data-level="B2">B2</button><button data-level="C1">C1</button></div><div class="grid" id="dictGrid" style="margin-top:12px"></div>`),
 shell("grammar","French Grammar","Rules, exceptions, examples and high-value B2–C1 structures.",`<div class="grid">${DATA.grammar.map(x=>`<article class="card"><span class="tag">${x[2]}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join("")}</div>`),
 shell("translation","English ↔ French Translation","Use this as a quick translation workspace. For nuanced passages, compare context rather than translating word-for-word.",`<div class="card"><textarea id="transIn" rows="7" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:10px" placeholder="Enter English or French text…"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button id="enfr">English → French</button><button id="fren">French → English</button></div><div id="transOut" class="answer" style="display:block;margin-top:14px">Translation output will appear here.</div></div>`),
 shell("synonyms","French Synonyms & Antonyms","Compare meaning, register and nuance.",`<div class="grid">${DATA.syn.map(x=>`<article class="card"><div class="word">${x[0]}</div><p><b>Synonyms:</b> ${x[1]}</p><p><b>Antonyms:</b> ${x[2]}</p><p class="muted">${x[3]}</p></article>`).join("")}</div>`),
 shell("phrases","Popular French Phrases & Idioms","Natural expressions with meaning and examples.",`<div class="grid">${DATA.phrases.map(x=>`<article class="card"><div class="word">${x[0]}</div><span class="tag">${x[3]}</span><p>${x[1]}</p><p><i>${x[2]}</i></p></article>`).join("")}</div>`),
 shell("vocabulary","French Vocabulary","A dedicated CEFR vocabulary bank with meanings, collocations, synonyms and antonyms.",`<div class="searchBox"><input id="vocabSearch" placeholder="Search vocabulary…"></div><div class="chips" id="vocabLevels"><button data-level="all">All</button><button data-level="B1">B1</button><button data-level="B2">B2</button><button data-level="C1">C1</button></div><div class="grid" id="vocabGrid" style="margin-top:12px"></div>`),
 shell("news","Daily French News","Live-ready French news hub. These cards open established French-language news sources directly in a new tab.",`<div class="grid">${DATA.news.map(x=>`<a class="card" href="${x[3]}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit"><span class="tag">${x[1]}</span><h3>${x[0]} ↗</h3><p>${x[2]}</p><p class="muted">Open current French reporting</p></a>`).join("")}</div><div class="card" style="margin-top:12px"><h3>How to use the news tab</h3><p>Open a source, read one article, then search unfamiliar words in the Dictionary. Focus on connectors, formal verbs and expressions used by journalists.</p></div>`), ,
 shell("crossword","French Crossword","A quick French vocabulary game with clues, checking, reveal and new puzzles.",`<div class="game card"><div class="livebar"><span class="dot"></span><span>French vocabulary puzzle • mobile friendly</span></div><div id="gameClues"></div><div id="gameGrid" class="gameGrid"></div><div id="gameMsg" class="gameMsg"></div><div class="gameControls"><button class="primary" id="checkGame">Check answers</button><button id="revealGame">Reveal</button><button id="newGame">New puzzle</button></div></div>`)
 shell("conjugation","French Conjugation","High-frequency irregular verbs. Start with the present forms below.",`<div class="searchBox"><input id="verbSearch" placeholder="Search a verb…"></div><div class="grid" id="conjGrid" style="margin-top:12px"></div>`),
 shell("collocations","French Collocations","Learn combinations that sound natural in French.",`<div class="grid">${DATA.coll.map(x=>`<article class="card"><div class="word">${x[0]}</div><p>${x[1]}</p></article>`).join("")}</div>`),
 shell("exercises","B2–C1 Grammar Exercises","Short practice with answers revealed on demand.",`<div class="grid">${[
["Bien qu'il ___ fatigué, il continue.","soit","bien que + subjonctif"],
["Si j'avais plus de temps, je ___ davantage.","lirais","si + imparfait → conditionnel"],
["Après qu'il ___, nous avons commencé.","est arrivé","après que + indicatif"],
["À moins qu'il ne ___, nous partirons.","pleuve","à moins que + subjonctif"]
].map((x,i)=>`<article class="card"><h3>${i+1}. ${x[0]}</h3><button class="reveal">Show answer</button><div class="answer"><b>${x[1]}</b><br>${x[2]}</div></article>`).join("")}</div>`)
].join("");
}
function go(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));window.scrollTo(0,0);if(id==="crossword")bindGame();if(id==="news")loadLiveNews()}
function detail(word){
 const w=DATA.words.find(x=>x[0].toLowerCase()===word.toLowerCase());
 if(!w)return;
 app.innerHTML=shell("detail","Word detail","Dictionary entry with connected information.",`<div class="detail card"><button class="back" id="back">← Back</button><div class="word">${esc(w[0])}</div><span class="tag">${w[2]} • ${w[3]}</span><h2>${esc(w[1])}</h2><p><b>Collocations:</b> ${esc(w[4])}</p><p><b>Synonyms:</b> ${esc(w[5])}</p><p><b>Antonyms:</b> ${esc(w[6])}</p><p><b>Example:</b> <i>Cette expression est couramment utilisée en français.</i></p><button id="speak">🔊 Hear pronunciation</button></div>`);
 document.querySelector(".view").classList.add("active");document.getElementById("back").onclick=()=>{render();bind();go("dictionary")};document.getElementById("speak").onclick=()=>{const u=new SpeechSynthesisUtterance(w[0]);u.lang="fr-FR";speechSynthesis.speak(u)}
}
function searchIndex(q){
 const n=q.toLowerCase().trim(); if(!n)return[];
 const out=[];
 DATA.words.forEach(w=>{const hay=w.join(" ").toLowerCase();if(hay.includes(n))out.push(["Dictionary",w[0],w[1],"dictionary",w[0]])});
 DATA.grammar.forEach(g=>{if((g[0]+" "+g[1]).toLowerCase().includes(n))out.push(["Grammar",g[0],g[1],"grammar"])});
 DATA.phrases.forEach(p=>{if(p.join(" ").toLowerCase().includes(n))out.push(["Phrase",p[0],p[1],"phrases"])});
 DATA.syn.forEach(s=>{if(s.join(" ").toLowerCase().includes(n))out.push(["Synonym",s[0],s[1],"synonyms"])});
 DATA.news.forEach(s=>{if(s.join(" ").toLowerCase().includes(n))out.push(["News",s[0],s[1]+" • "+s[2],"news"])});
 Object.keys(DATA.conj).forEach(v=>{if(v.toLowerCase().includes(n))out.push(["Conjugation",v,"Present tense forms","conjugation"])});
 if(["formal complaint","complaint","translation","daily news","news","collocation","exercise"].some(x=>x.includes(n)||n.includes(x))) {
  const map=[["formal complaint","Phrases","Formal complaint expressions","phrases"],["translation","Translation","English ↔ French","translation"],["daily news","Daily News","French reading","news"],["news","Daily News","French reading","news"],["collocation","Collocations","Natural combinations","collocations"],["exercise","Exercises","B2–C1 practice","exercises"]];
  map.forEach(x=>{if(x[0].includes(n)||n.includes(x[0]))out.push(x)})
 }
 return out.filter((x,i)=>out.findIndex(y=>y[0]===x[0]&&y[1]===x[1])===i).slice(0,12);
}

const PUZZLES=[
["FRANCE","Country where French is an official language","France"],
["AMOUR","Love","love"],
["LIVRE","Book","book"],
["ECOLE","School","school"],
["JARDIN","Garden","garden"],
["VOYAGE","Trip / journey","journey"]
];
let currentPuzzle=null;
function newGame(){
 currentPuzzle=PUZZLES[Math.floor(Math.random()*PUZZLES.length)];
 const clues=document.getElementById("gameClues"),grid=document.getElementById("gameGrid"),msg=document.getElementById("gameMsg");
 if(!grid)return;
 clues.innerHTML='<div class="card"><b>Clue:</b> '+esc(currentPuzzle[1])+'<br><span class="muted">English: '+esc(currentPuzzle[2])+'</span></div>';
 grid.innerHTML="";
 for(let i=0;i<currentPuzzle[0].length;i++){
  grid.innerHTML+='<div class="cell"><small>'+(i+1)+'</small><input maxlength="1" aria-label="Letter '+(i+1)+'"></div>';
 }
 msg.textContent="";
 grid.querySelector("input")?.focus();
}
function checkGame(){
 if(!currentPuzzle)return;
 const letters=[...document.querySelectorAll("#gameGrid input")].map(x=>x.value.toUpperCase());
 const msg=document.getElementById("gameMsg");
 if(letters.some(x=>!x)){msg.textContent="Fill in all the letters.";return}
 msg.textContent=letters.join("")===currentPuzzle[0]?"✓ Correct!":"Not quite. Try again.";
}
function revealGame(){
 if(!currentPuzzle)return;
 document.querySelectorAll("#gameGrid input").forEach((x,i)=>x.value=currentPuzzle[0][i]);
 document.getElementById("gameMsg").textContent="Answer: "+currentPuzzle[0];
}
function bindGame(){
 document.getElementById("checkGame")?.addEventListener("click",checkGame);
 document.getElementById("revealGame")?.addEventListener("click",revealGame);
 document.getElementById("newGame")?.addEventListener("click",newGame);
 newGame();
}
const NEWS_FEEDS=[
 ["France 24","https://www.france24.com/fr/rss"],
 ["RFI","https://www.rfi.fr/fr/rss"],
 ["Franceinfo","https://www.franceinfo.fr/titres.rss"]
];
async function loadLiveNews(){
 const sec=document.getElementById("news"),grid=sec?.querySelector(".grid");
 if(!grid)return;
 grid.innerHTML='<div class="card"><b>Loading latest French headlines…</b><p class="muted">Fetching live sources.</p></div>';
 const proxy="https://api.rss2json.com/v1/api.json?rss_url=";
 let items=[];
 for(const [source,url] of NEWS_FEEDS){
  try{
   const r=await fetch(proxy+encodeURIComponent(url),{cache:"no-store"});
   if(!r.ok)continue;
   const j=await r.json();
   (j.items||[]).slice(0,4).forEach(x=>items.push({source,title:x.title,desc:x.description||"",link:x.link,date:x.pubDate}));
  }catch(e){}
 }
 if(items.length){
  grid.innerHTML=items.slice(0,12).map(x=>'<a class="card newsCard" href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer"><span class="tag">'+esc(x.source)+'</span><h3>'+esc(x.title)+' ↗</h3><p>'+esc(String(x.desc).replace(/<[^>]*>/g," ").slice(0,180))+'…</p><p class="newsMeta">'+esc(x.date||"Latest")+'</p></a>').join("");
 }else{
  grid.innerHTML=DATA.news.map(x=>'<a class="card newsCard" href="'+x[3]+'" target="_blank" rel="noopener noreferrer"><span class="tag">'+esc(x[1])+'</span><h3>'+esc(x[0])+' ↗</h3><p>'+esc(x[2])+'</p><p class="newsMeta">Open official live source</p></a>').join("");
 }
}
async function onlineFrenchLookup(q){
 if(!/^[A-Za-zÀ-ÿŒœÆæ -]+$/.test(q)||q.length<2)return null;
 try{
  const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/fr/"+encodeURIComponent(q.trim()),{cache:"no-store"});
  if(!r.ok)return null;
  const j=await r.json(); return j[0]||null;
 }catch(e){return null}
}
