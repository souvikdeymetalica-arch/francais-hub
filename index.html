<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b56">
<title>FrançaisHub — French Reference</title>

<style>
:root{
 --nav:#183b56;--ink:#17202a;--muted:#66727e;--line:#dce2e6;
 --bg:#f6f8f9;--card:#fff;--accent:#d9a441
}
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;background:var(--bg);color:var(--ink);
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{
 position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line)
}
.brand{
 max-width:1180px;margin:auto;padding:12px 14px 8px;
 display:flex;align-items:center;justify-content:space-between
}
.brand b{font-family:Georgia,serif;font-size:22px;color:var(--nav)}
.brand small{color:var(--muted)}
.tabs{
 max-width:1180px;margin:auto;display:flex;gap:6px;overflow:auto;
 padding:0 14px 9px;-webkit-overflow-scrolling:touch
}
.tabs button{
 white-space:nowrap;border:1px solid var(--line);background:#fff;
 border-radius:9px;padding:8px 10px;font-size:13px
}
.tabs button.active{
 background:var(--nav);color:#fff;border-color:var(--nav)
}
main{max-width:1180px;margin:auto;padding:0 14px 50px}
.view{display:none}
.view.active{display:block}
.hero{padding:28px 0 18px}
.hero h1{
 font:700 clamp(31px,7vw,56px)/1.05 Georgia,serif;
 margin:0 0 9px;color:var(--nav)
}
.hero p{color:var(--muted);margin:0;max-width:720px}
.searchWrap{position:relative;margin:18px 0}
.searchBox{
 display:flex;align-items:center;gap:9px;background:#fff;
 border:2px solid var(--nav);border-radius:14px;padding:11px 13px;
 box-shadow:0 5px 18px #0000000d
}
.searchBox input{
 flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px
}
.kbd{
 font-size:11px;color:var(--muted);border:1px solid var(--line);
 padding:3px 6px;border-radius:5px
}
.results{
 position:absolute;left:0;right:0;top:61px;z-index:300;background:#fff;
 border:1px solid var(--line);border-radius:0 0 13px 13px;
 box-shadow:0 16px 35px #0002;max-height:65vh;overflow:auto;display:none
}
.result{
 display:block;width:100%;border:0;border-bottom:1px solid #edf0f2;
 background:#fff;text-align:left;padding:12px 14px
}
.result:hover{background:#f2f5f6}
.result b{display:block}
.result small{display:block;color:var(--muted);margin-top:3px}
.chips{
 display:flex;gap:7px;overflow:auto;padding:2px 0 15px
}
.chips button{
 white-space:nowrap;border:1px solid var(--line);background:#fff;
 border-radius:99px;padding:7px 11px
}
.grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:11px
}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:13px;padding:16px
}
.card h3{margin:0 0 7px;color:var(--nav)}
.card p{margin:6px 0;line-height:1.5}
.muted{color:var(--muted)}
.tag{
 font-size:11px;color:var(--muted);text-transform:uppercase;
 letter-spacing:.5px
}
.word{font:700 28px Georgia,serif;color:var(--nav)}
.answer{
 display:none;margin-top:10px;padding:10px;background:#f1f5f6;border-radius:8px
}
.detail{max-width:850px}
.detail .word{font-size:42px}
.back{
 margin-bottom:14px;border:1px solid var(--line);background:#fff;
 border-radius:8px;padding:8px 11px
}
footer{
 max-width:1180px;margin:auto;padding:25px 14px;color:var(--muted);
 font-size:12px;border-top:1px solid var(--line)
}
.livebar{
 display:flex;align-items:center;gap:8px;background:#102d43;color:#fff;
 border-radius:11px;padding:9px 11px;margin:10px 0 14px;font-size:13px
}
.dot{
 width:8px;height:8px;background:#61d095;border-radius:50%;
 box-shadow:0 0 0 4px #61d09522
}
.newsTools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.newsTools button,.gameControls button{
 border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px
}
.newsCard{display:block;text-decoration:none;color:inherit}
.newsMeta{font-size:11px;color:var(--muted);margin-top:8px}
.game{max-width:720px;margin:auto}
.gameGrid{
 display:grid;grid-template-columns:repeat(8,1fr);gap:4px;
 max-width:520px;margin:16px auto
}
.cell{
 aspect-ratio:1;border:1px solid #c9d1d6;background:#fff;
 border-radius:4px;position:relative
}
.cell input{
 width:100%;height:100%;border:0;background:transparent;
 text-align:center;font-weight:700;font-size:20px;
 text-transform:uppercase;outline:0
}
.cell small{
 position:absolute;top:1px;left:3px;font-size:8px;
 color:#777;pointer-events:none
}
.gameMsg{min-height:28px;margin:10px 0;font-weight:600}
.gameControls{display:flex;gap:8px;flex-wrap:wrap}
.gameControls .primary{
 background:#183b56;color:#fff;border-color:#183b56
}
.primary{
 background:#183b56;color:#fff;border-color:#183b56;
 padding:9px 12px;border-radius:8px
}
@media(max-width:800px){
 .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
 .brand small{display:none}
 .grid{grid-template-columns:1fr}
 .hero{padding-top:22px}
 .hero h1{font-size:37px}
 main{padding:0 10px 40px}
 .tabs button{font-size:14px;padding:9px 12px}
}
</style>

</head>
